name: Publish LonghiDev website

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: longhidev-website-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lerma4/another-longhidev-website
  GITOPS_REPOSITORY: Lerma4/k3s-argocd-gitops
  GITOPS_OVERLAY_FILE: apps/longhidev-website/overlays/longhidev/kustomization.yaml

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TAG="sha-${COMMIT_SHA::7}"
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
      - name: Check out GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops
      - name: Update GitOps image tag
        env:
          COMMIT_SHA: ${{ github.sha }}
        working-directory: gitops
        run: |
          TAG="sha-${COMMIT_SHA::7}"
          test -f "$GITOPS_OVERLAY_FILE"
          perl -0pi -e "s/newTag: sha-[^\n]+/newTag: $TAG/g" "$GITOPS_OVERLAY_FILE"
          git add "$GITOPS_OVERLAY_FILE"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: deploy LonghiDev website $TAG"
          git push
